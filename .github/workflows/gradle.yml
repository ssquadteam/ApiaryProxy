# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  RELEASE_BRANCH: refs/heads/main

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != env.RELEASE_BRANCH }}

      - name: Generate Release Tag
        if: github.ref == env.RELEASE_BRANCH
        id: release_tag
        run: |
          git fetch --tags

          LATEST_BUILD=0
          if git tag | grep -qE "^build-[0-9]+$"; then
            LATEST_BUILD=$(git tag | grep -E "^build-[0-9]+$" | sed 's/build-//' | sort -n | tail -1)
          fi

          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "tag=build-$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "build_nr=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Building build-$NEW_BUILD (previous highest: $LATEST_BUILD)"

      - name: Build with Gradle
        env:
          BUILD_NUMBER: ${{ steps.release_tag.outputs.build_nr }}
        run: ./gradlew build

      - name: Rename Release Jars
        if: github.ref == env.RELEASE_BRANCH
        run: |
          FAT_JAR=$(ls proxy/build/libs/velocity-proxy-*-all.jar)
          VERSION=${FAT_JAR#proxy/build/libs/velocity-proxy-}
          VERSION=${VERSION%-all.jar}
          cp "$FAT_JAR" "proxy/build/libs/apiaryproxy-fatjar-$VERSION-${{ steps.release_tag.outputs.build_nr }}.jar"

          BOOTSTRAP_JAR=$(ls bootstrap/build/libs/velocity-bootstrap-*.jar | grep -v -- '-sources\.jar')
          VERSION=${BOOTSTRAP_JAR#bootstrap/build/libs/velocity-bootstrap-}
          VERSION=${VERSION%.jar}
          cp "$BOOTSTRAP_JAR" "bootstrap/build/libs/apiaryproxy-$VERSION-${{ steps.release_tag.outputs.build_nr }}.jar"

      - name: Publish to Maven Repository
        if: github.ref == env.RELEASE_BRANCH && env.MAVEN_USERNAME != ''
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ steps.release_tag.outputs.build_nr }}
          ORG_GRADLE_PROJECT_apiaryUsername: ${{ env.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_apiaryPassword: ${{ env.MAVEN_PASSWORD }}
        run: ./gradlew publishAllPublicationsToApiaryRepository

      - name: Upload Build Artifacts
        if: github.ref != env.RELEASE_BRANCH
        uses: actions/upload-artifact@v5
        with:
          name: apiaryproxy-jars
          path: |
            proxy/build/libs/velocity-proxy-*-all.jar
            bootstrap/build/libs/velocity-bootstrap-*.jar
          if-no-files-found: error

      - name: Upload as GitHub Release
        if: github.ref == env.RELEASE_BRANCH
        uses: softprops/action-gh-release@v3
        with:
          name: "ApiaryProxy ${{ steps.release_tag.outputs.tag }}"
          tag_name: "${{ steps.release_tag.outputs.tag }}"
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          generate_release_notes: true
          body: |
            ## Which jar should I download?

            **Recommended — `apiaryproxy-<version>-<build>.jar` (bootstrap jar)**
            This is the bootstrap jar. It downloads the required dependencies only once, keeping the download small. Use this one.

            **Fallback — `apiaryproxy-fatjar-<version>-<build>.jar`**
            Only download the fatjar if the bootstrap jar is causing issues for you. If it is, please [open an issue](https://github.com/${{ github.repository }}/issues) describing the problem so we can fix it.

            ---
          files: |
            proxy/build/libs/apiaryproxy-fatjar-*-${{ steps.release_tag.outputs.build_nr }}.jar
            bootstrap/build/libs/apiaryproxy-*-${{ steps.release_tag.outputs.build_nr }}.jar
